<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
<rect width="960" height="400" fill="white"/>
<text x="48" y="64" font-family="Georgia, serif" font-size="30" fill="#0B1F4A" font-weight="bold">Endpointing: cut-offs and wait</text>
<text x="48" y="94" font-family="Georgia, serif" font-size="16" fill="#475569">Slow utterances cut off, of 3 in the fixture set; wait on completed turns (Lesson 06)</text>
<text x="48" y="174" font-family="Georgia, serif" font-size="16" fill="#0B1F4A" text-anchor="start">Fixed 400 ms</text><rect x="300" y="150" width="420" height="30" fill="#DC2626"/><text x="760" y="174" font-family="Georgia, serif" font-size="15" fill="#0B1F4A" text-anchor="start">3 cut off, waits 400 ms</text><text x="48" y="238" font-family="Georgia, serif" font-size="16" fill="#0B1F4A" text-anchor="start">Fixed 800 ms</text><rect x="300" y="214" width="420" height="30" fill="#DC2626"/><text x="760" y="238" font-family="Georgia, serif" font-size="15" fill="#0B1F4A" text-anchor="start">3 cut off, waits 800 ms</text><text x="48" y="302" font-family="Georgia, serif" font-size="16" fill="#0B1F4A" text-anchor="start">Adaptive 450 ms</text><rect x="300" y="278" width="140" height="30" fill="#059669"/><text x="760" y="302" font-family="Georgia, serif" font-size="15" fill="#0B1F4A" text-anchor="start">1 cut off, waits 300 ms</text><text x="48" y="376" font-family="Georgia, serif" font-size="13" fill="#475569">The adaptive policy waits longer mid-utterance so it can wait less at the end.</text>
</svg>