<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
<rect width="960" height="480" fill="white"/>
<text x="48" y="64" font-family="Georgia, serif" font-size="30" fill="#0B1F4A" font-weight="bold">The latency ledger</text>
<text x="48" y="94" font-family="Georgia, serif" font-size="16" fill="#475569">Simulated stage totals over 24 fixture turns, streamed design (Lesson 02)</text>
<text x="48" y="172" font-family="Georgia, serif" font-size="16" fill="#0B1F4A" text-anchor="start">Endpointing</text><rect x="300" y="150" width="560" height="28" fill="#0891B2"/><text x="876" y="172" font-family="Georgia, serif" font-size="15" fill="#0B1F4A" text-anchor="end">19,200 ms (64.5%)</text><text x="48" y="228" font-family="Georgia, serif" font-size="16" fill="#0B1F4A" text-anchor="start">Model first token</text><rect x="300" y="206" width="147" height="28" fill="#0B1F4A"/><text x="876" y="228" font-family="Georgia, serif" font-size="15" fill="#0B1F4A" text-anchor="end">5,041 ms (16.9%)</text><text x="48" y="284" font-family="Georgia, serif" font-size="16" fill="#0B1F4A" text-anchor="start">Synthesis first chunk</text><rect x="300" y="262" width="92" height="28" fill="#0B1F4A"/><text x="876" y="284" font-family="Georgia, serif" font-size="15" fill="#0B1F4A" text-anchor="end">3,157 ms (10.6%)</text><text x="48" y="340" font-family="Georgia, serif" font-size="16" fill="#0B1F4A" text-anchor="start">Transcription final</text><rect x="300" y="318" width="41" height="28" fill="#0B1F4A"/><text x="876" y="340" font-family="Georgia, serif" font-size="15" fill="#0B1F4A" text-anchor="end">1,407 ms (4.7%)</text><text x="48" y="396" font-family="Georgia, serif" font-size="16" fill="#0B1F4A" text-anchor="start">Jitter</text><rect x="300" y="374" width="28" height="28" fill="#0B1F4A"/><text x="876" y="396" font-family="Georgia, serif" font-size="15" fill="#0B1F4A" text-anchor="end">960 ms (3.2%)</text><text x="48" y="456" font-family="Georgia, serif" font-size="13" fill="#475569">Two thirds of the wait is a policy decision: how much silence ends a turn.</text>
</svg>