name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python files
        run: python -m compileall .
      - name: Validate course structure
        run: python3 tools/validate_course.py
      - name: Check links
        run: python3 tools/check_links.py
      - name: Run every lesson smoke test
        run: |
          for d in [0-9][0-9]-*/; do
            echo "== $d"
            (cd "$d" && python3 smoke_test.py)
          done
